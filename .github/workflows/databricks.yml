name: Databricks CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Roda lint, validate e integracao (ci) sob demanda em qualquer branch; nunca faz deploy em prod.
  workflow_dispatch:

permissions:
  contents: read

env:
  # So a IDENTIDADE vem do GitHub. O host mora no databricks.yml — fonte unica de verdade.
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  # O application ID do SP e o proprio client ID: alimenta var.service_principal do target prod.
  BUNDLE_VAR_service_principal: ${{ secrets.DATABRICKS_CLIENT_ID }}

jobs:
  # Roda em qualquer PR, inclusive de fork: nao toca no Databricks, nao precisa de secret.
  test:
    name: lint + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historico completo: tests/test_data_contracts.py compara os contratos com origin/master
          # para exigir bump de versao (MAJOR em mudanca incompativel).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - name: pytest (offline)
        env:
          DATABRICKS_SKIP_CONNECT: "1"   # nao abre Databricks Connect so para coletar
        run: uv run pytest -v

  validate:
    name: bundle validate (prod)
    runs-on: ubuntu-latest
    needs: test
    # Repo PUBLICO: PR de fork nao recebe secrets. E 'bundle validate' NAO e offline — ele
    # resolve o lookup: do warehouse e checa o root_path via API. Sem credencial ele falha.
    # Entao PR de fork para aqui, em vez de morrer com erro de auth confuso.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@v1.21.0
        with:
          version: 1.21.0   # mesma versao do CLI local: o CI nao deve te surpreender
      - run: databricks bundle validate --strict -t prod

  # Gate de integracao: publica o bundle no target ci (catalogo bakehouse_ci, isolado) e roda o
  # job inteiro — pipeline, verificacao dos contratos e metric views. Prod so recebe deploy se
  # isso passar com o codigo exato do commit.
  integration:
    name: bundle run (ci)
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    # Um catalogo e um state compartilhados por todos os PRs: um por vez, e nunca cancelar no
    # meio (deixaria o lock do state preso e o pipeline pela metade).
    concurrency:
      group: integration-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@v1.21.0
        with:
          version: 1.21.0
      - run: databricks bundle deploy -t ci
      - run: databricks bundle run bakehouse_medallion_job -t ci

  deploy:
    name: bundle deploy (prod)
    runs-on: ubuntu-latest
    needs: [validate, integration]
    # Gate humano: o job fica "Waiting for approval" ate o reviewer do environment aprovar.
    # Cria o environment com: gh api --method PUT /repos/<owner>/<repo>/environments/prod
    #   --input - <<< '{"reviewers":[{"type":"User","id":301368}]}'
    environment: prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Um deploy por vez: todos escrevem o MESMO terraform.tfstate em <root_path>/state.
    # cancel-in-progress FICA false: cancelar no meio do apply deixa o lock preso.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Prod nunca volta no tempo: um "Re-run" de execucao antiga, ou a aprovacao de um deploy que
      # ja foi superado por outro merge, publicaria codigo velho. So segue se este commit ainda for
      # a ponta da master no momento do deploy (checado DEPOIS da aprovacao).
      - name: Garante que o commit ainda e o ultimo da master
        run: |
          latest=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | cut -f1)
          if [ -z "$latest" ]; then
            echo "::error::Nao foi possivel ler a ponta da master. Deploy abortado."
            exit 1
          fi
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Este run publicaria ${GITHUB_SHA}, mas a master ja esta em ${latest}. Deploy abortado: commits antigos nunca vao para prod. Para publicar, use o run do commit mais recente."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} e a ponta da master."
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@v1.21.0
        with:
          version: 1.21.0
      - run: databricks bundle deploy -t prod
      - name: O que foi para o workspace
        run: databricks bundle summary -t prod
