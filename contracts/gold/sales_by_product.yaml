# Data contract (ODCS v3) for gold.sales_by_product. Rules: contracts/README.md.
apiVersion: v3.0.2
kind: DataContract
id: bakehouse.gold.sales_by_product
name: sales_by_product
version: 1.0.0
status: active
domain: bakehouse
dataProduct: bakehouse_medallion
team:
  - username: altamiropedrosa
    role: owner
description:
  purpose: Product mix sliced by day and franchise country.
  usage: Product ranking and mix over time. Measures are additive, roll up with SUM.
  limitations: Sales of unknown franchises have a NULL country.
schema:
  - name: sales_by_product
    physicalName: gold.sales_by_product
    physicalType: materialized_view
    description: Sales per product, day and franchise country (additive measures)
    dataGranularityDescription: One row per product, transaction_date and country.
    properties:
      - name: product
        logicalType: string
        physicalType: STRING
        required: false
        description: Product name
      - name: transaction_date
        logicalType: date
        physicalType: DATE
        required: true
        description: Calendar date of the sales
      - name: transaction_month
        logicalType: date
        physicalType: DATE
        required: true
        description: First day of the month of the sales
      - name: country
        logicalType: string
        physicalType: STRING
        required: false
        description: Franchise country
      - name: orders
        logicalType: integer
        physicalType: BIGINT
        required: true
        description: Number of sales transactions
      - name: units_sold
        logicalType: integer
        physicalType: BIGINT
        required: true
        description: Total units sold
      - name: revenue
        logicalType: number
        physicalType: DECIMAL(22,2)
        required: true
        description: Total revenue, sum of total_price
slaProperties:
  - property: frequency
    value: 1
    unit: d
  - property: latency
    value: 26
    unit: h
