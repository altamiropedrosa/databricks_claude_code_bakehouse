# Data contract (ODCS v3) for silver.review_product_opinions: the opinion about each product cited
# in a customer review, extracted with ai_extract. Spec: specs/001-opinioes-por-produto.md.
# Rules: contracts/README.md. Checked by tests/test_data_contracts.py.
apiVersion: v3.0.2
kind: DataContract
id: bakehouse.silver.review_product_opinions
name: review_product_opinions
version: 1.0.0
status: active
domain: bakehouse
dataProduct: bakehouse_medallion
team:
  - username: altamiropedrosa
    role: owner
description:
  purpose: Opinion and its main reason for each product cited in a customer review, extracted with AI.
  usage: Source for gold.product_opinions_by_franchise. Prefer the gold mart for dashboards.
  limitations: >-
    Extracted by ai_extract from synthetic English reviews: each review is sent to the model once,
    so a later model version does not change rows already extracted. Reviews that cite no product,
    or whose extraction failed, have no rows and are counted in the pipeline quality metrics.
schema:
  - name: review_product_opinions
    physicalName: silver.review_product_opinions
    physicalType: streaming_table
    description: Opinion about each product cited in a customer review, extracted with ai_extract
    dataGranularityDescription: One row per review and cited product.
    properties:
      - name: review_id
        logicalType: integer
        physicalType: INT
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: Review identifier
      - name: franchise_id
        logicalType: integer
        physicalType: BIGINT
        required: true
        description: Franchise the review is about
      - name: review_date
        logicalType: date
        physicalType: DATE
        required: true
        description: Calendar date of the review
      - name: product
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: Product cited in the review, one of the 6 products sold by the chain
      - name: opinion
        logicalType: string
        physicalType: STRING
        required: true
        description: Opinion about the product, positive, negative or neutral
      - name: reason
        logicalType: string
        physicalType: STRING
        required: true
        description: Main reason of the opinion, taste, texture, freshness, price, availability or other
      - name: _ingested_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Time the review was sent to the model
    quality:
      - name: known_franchise
        type: custom
        engine: lakeflow
        implementation: franchise_id IS NOT NULL
        customProperties:
          - property: onViolation
            value: drop_row
      - name: valid_review_date
        type: custom
        engine: lakeflow
        implementation: review_date IS NOT NULL
        customProperties:
          - property: onViolation
            value: drop_row
      - name: cited_product
        type: custom
        engine: lakeflow
        implementation: product IS NOT NULL
        customProperties:
          - property: onViolation
            value: drop_row
      - name: valid_product
        type: custom
        engine: lakeflow
        implementation: >-
          product IN ('Outback Oatmeal', 'Austin Almond Biscotti', 'Orchard Oasis', 'Golden Gate Ginger',
          'Tokyo Tidbits', 'Pearly Pies')
        customProperties:
          - property: onViolation
            value: drop_row
      - name: valid_opinion
        type: custom
        engine: lakeflow
        implementation: opinion IN ('positive', 'negative', 'neutral')
        customProperties:
          - property: onViolation
            value: drop_row
      - name: valid_reason
        type: custom
        engine: lakeflow
        implementation: reason IN ('taste', 'texture', 'freshness', 'price', 'availability', 'other')
        customProperties:
          - property: onViolation
            value: drop_row
slaProperties:
  - property: frequency
    value: 1
    unit: d
  - property: latency
    value: 26
    unit: h
