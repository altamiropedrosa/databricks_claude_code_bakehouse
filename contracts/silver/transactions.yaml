# Data contract (ODCS v3) for silver.transactions: the conformed sales fact that every gold
# mart and the semantic layer read from. The catalog is not part of physicalName: it comes
# from the bundle target. Rules: contracts/README.md. Checked by tests/test_data_contracts.py.
apiVersion: v3.0.2
kind: DataContract
id: bakehouse.silver.transactions
name: transactions
version: 1.0.0
status: active
domain: bakehouse
dataProduct: bakehouse_medallion
team:
  - username: altamiropedrosa
    role: owner
description:
  purpose: Cleaned sales transactions enriched with franchise and customer attributes.
  usage: Source for the gold marts and for business metrics. Prefer gold for dashboards.
  limitations: >-
    Rows with missing id or timestamp, or with non-positive quantity or amount, are dropped.
    franchise_* and customer_* columns are NULL when the dimension has no match.
schema:
  - name: transactions
    physicalName: silver.transactions
    physicalType: materialized_view
    description: Cleaned Bakehouse sales transactions enriched with franchise and customer
    dataGranularityDescription: One row per sales transaction.
    properties:
      - name: transaction_id
        logicalType: integer
        physicalType: BIGINT
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: Sales transaction identifier
      - name: transaction_ts
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Date and time of the sale
      - name: transaction_date
        logicalType: date
        physicalType: DATE
        required: true
        description: Calendar date of the sale
      - name: transaction_month
        logicalType: date
        physicalType: DATE
        required: true
        description: First day of the month of the sale
      - name: transaction_hour
        logicalType: integer
        physicalType: INT
        required: true
        description: Hour of the day of the sale, 0 to 23
      - name: transaction_weekday
        logicalType: string
        physicalType: STRING
        required: true
        description: Weekday name of the sale, e.g. Monday
      - name: product
        logicalType: string
        physicalType: STRING
        required: false
        description: Product name
      - name: quantity
        logicalType: integer
        physicalType: INT
        required: true
        description: Units sold, always greater than zero
      - name: unit_price
        logicalType: number
        physicalType: DECIMAL(12,2)
        required: false
        description: Price per unit
      - name: total_price
        logicalType: number
        physicalType: DECIMAL(12,2)
        required: true
        description: Transaction amount, always greater than zero
      - name: payment_method
        logicalType: string
        physicalType: STRING
        required: false
        description: Payment method in lower case, expected visa, mastercard or amex
      - name: card_last4
        logicalType: string
        physicalType: STRING
        required: false
        classification: restricted
        description: Last 4 digits of the payment card, the full number is never stored
      - name: franchise_id
        logicalType: integer
        physicalType: BIGINT
        required: false
        description: Franchise where the sale happened
      - name: franchise_name
        logicalType: string
        physicalType: STRING
        required: false
        description: Franchise name
      - name: franchise_city
        logicalType: string
        physicalType: STRING
        required: false
        description: Franchise city
      - name: franchise_country
        logicalType: string
        physicalType: STRING
        required: false
        description: Franchise country, where the sale happened
      - name: franchise_size
        logicalType: string
        physicalType: STRING
        required: false
        description: Franchise size
      - name: customer_id
        logicalType: integer
        physicalType: BIGINT
        required: false
        description: Customer identifier
      - name: customer_name
        logicalType: string
        physicalType: STRING
        required: false
        classification: restricted
        description: Customer full name (personal data)
      - name: customer_country
        logicalType: string
        physicalType: STRING
        required: false
        description: Customer country
      - name: customer_continent
        logicalType: string
        physicalType: STRING
        required: false
        description: Customer continent
      - name: _ingested_at
        logicalType: date
        physicalType: TIMESTAMP
        required: true
        description: Time the source row was ingested into bronze
    # Mirrors the CONSTRAINT ... EXPECT clauses of the pipeline SQL (onViolation: warn | drop_row | fail_update).
    quality:
      - name: valid_transaction_id
        type: custom
        engine: lakeflow
        implementation: transaction_id IS NOT NULL
        customProperties:
          - property: onViolation
            value: drop_row
      - name: valid_transaction_ts
        type: custom
        engine: lakeflow
        implementation: transaction_ts IS NOT NULL
        customProperties:
          - property: onViolation
            value: drop_row
      - name: positive_quantity
        type: custom
        engine: lakeflow
        implementation: quantity IS NOT NULL AND quantity > 0
        customProperties:
          - property: onViolation
            value: drop_row
      - name: positive_total_price
        type: custom
        engine: lakeflow
        implementation: total_price IS NOT NULL AND total_price > 0
        customProperties:
          - property: onViolation
            value: drop_row
      - name: consistent_total_price
        type: custom
        engine: lakeflow
        implementation: total_price = quantity * unit_price
        customProperties:
          - property: onViolation
            value: warn
      - name: known_franchise
        type: custom
        engine: lakeflow
        implementation: franchise_name IS NOT NULL
        customProperties:
          - property: onViolation
            value: warn
      - name: known_customer
        type: custom
        engine: lakeflow
        implementation: customer_name IS NOT NULL
        customProperties:
          - property: onViolation
            value: warn
      - name: valid_payment_method
        type: custom
        engine: lakeflow
        implementation: payment_method IN ('visa', 'mastercard', 'amex')
        customProperties:
          - property: onViolation
            value: warn
slaProperties:
  - property: frequency
    value: 1
    unit: d
  - property: latency
    value: 26
    unit: h
