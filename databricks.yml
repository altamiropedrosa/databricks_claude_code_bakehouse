# This is a Declarative Automation Bundle definition for databricks_claude_code_bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_code_bakehouse
  uuid: f1c7e45d-050f-40ac-95b1-8b5ab2229be5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
# The catalog is the ONLY thing that differs between targets: never hardcode it in
# resource YAML or SQL. Schema names come from resources/bakehouse.schemas.yml.
variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard
    lookup:
      warehouse: Serverless Starter Warehouse
  service_principal:
    description: >-
      Application ID of the service principal that deploys and runs prod. CI passes it
      as BUNDLE_VAR_service_principal (same value as DATABRICKS_CLIENT_ID).
    default: ""

targets:
  dev:
    # The dev target intentionally does NOT use 'mode: development': that mode
    # forces a 'dev_<user>_' prefix on Unity Catalog schemas, and the medallion
    # schemas must be named exactly bronze/silver/gold in every target.
    # The useful parts of development mode are replicated through presets below.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    default: true
    workspace:
      host: https://dbc-02964a61-2c9c.cloud.databricks.com
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 4
      tags:
        dev: ${workspace.current_user.short_name}
    variables:
      catalog: bakehouse_dev
  prod:
    # Prod is deployed by CI (.github/workflows/databricks.yml) as the service principal.
    # root_path is pinned to the service principal's home so there is a single copy of
    # the prod deployment state no matter who runs 'bundle deploy -t prod'.
    mode: production
    workspace:
      host: https://dbc-02964a61-2c9c.cloud.databricks.com
      root_path: /Workspace/Users/${var.service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
      catalog: bakehouse_prod
    permissions:
      - user_name: altamiro.pedrosa@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.service_principal}
        level: CAN_MANAGE
