# This is a Declarative Automation Bundle definition for databricks_claude_code_bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_code_bakehouse
  uuid: f1c7e45d-050f-40ac-95b1-8b5ab2229be5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-02964a61-2c9c.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-02964a61-2c9c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/altamiro.pedrosa@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/altamiro.pedrosa@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: altamiro.pedrosa@gmail.com
        level: CAN_MANAGE
