[project]
name = "databricks_claude_code_bakehouse"
version = "0.0.1"
authors = [{ name = "altamiro.pedrosa@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
    "pyyaml>=6.0.3",
    "mcp>=2.3.0",
]

[project.scripts]
main = "databricks_claude_code_bakehouse.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
# Vendored agent skills, not project code.
extend-exclude = [".claude", ".ai-dev-kit", "scripts/*.ipynb"]
